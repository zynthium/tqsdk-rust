name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Check examples
        run: cargo check --workspace --examples

      - name: Test workspace
        run: cargo test --workspace

      - name: Test workspace all features
        run: cargo test --workspace --all-features

      - name: Clippy examples and all targets
        run: cargo clippy --workspace --examples --all-targets -- -D warnings

      - name: Check no default features
        run: cargo check --workspace --no-default-features

      - name: Check no default features examples
        run: cargo check --workspace --no-default-features --examples

      - name: Test session no default features
        run: cargo test -p tqsdk-session --no-default-features

      - name: Check all features examples
        run: cargo check --workspace --all-features --examples

      - name: Strict docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Package metadata
        run: cargo package --workspace --no-verify

  relay-dashboard:
    name: Relay dashboard UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crates/tqsdk-relay/dashboard-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte
        run: pnpm run check

      - name: Test dashboard
        run: pnpm run test

      - name: Build embedded dashboard
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test dashboard e2e
        run: pnpm run test:e2e

  fuzz-build:
    name: Fuzz targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build
