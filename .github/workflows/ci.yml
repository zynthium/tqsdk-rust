name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust SDK crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Check SDK examples
        run: cargo check --examples

      - name: Test SDK crates
        run: cargo test

      - name: Test SDK crates all features
        run: cargo test --all-features

      - name: Clippy SDK examples and all targets
        run: cargo clippy --examples --all-targets -- -D warnings

      - name: Check SDK no default features
        run: cargo check --no-default-features

      - name: Check SDK no default features examples
        run: cargo check --no-default-features --examples

      - name: Test session no default features
        run: cargo test -p tqsdk-session --no-default-features

      - name: Check SDK all features examples
        run: cargo check --all-features --examples

      - name: Strict SDK docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: SDK package metadata
        run: cargo package --no-verify

  relay-rust:
    name: Relay Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check relay no default features
        run: cargo check -p tqsdk-relay --no-default-features

      - name: Test relay
        run: cargo test -p tqsdk-relay --tests

      - name: Clippy relay
        run: cargo clippy -p tqsdk-relay --all-targets -- -D warnings

      - name: Strict relay docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p tqsdk-relay --no-deps --all-features

  relay-dashboard:
    name: Relay dashboard UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crates/tqsdk-relay/dashboard-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte
        run: pnpm run check

      - name: Test dashboard
        run: pnpm run test

      - name: Build embedded dashboard
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test dashboard e2e
        run: pnpm run test:e2e

  fuzz-build:
    name: Fuzz targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build
