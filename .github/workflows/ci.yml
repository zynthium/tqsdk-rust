name: CI

on:
  push:
  pull_request:

jobs:
  daily-kline-golden:
    name: Daily Kline official conformance
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, tqsdk-daily-golden]
    env:
      TQSDK_DAILY_KLINE_GOLDEN_PACKET: ${{ vars.TQSDK_DAILY_KLINE_GOLDEN_PACKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable packet
        run: |
          test -n "$TQSDK_DAILY_KLINE_GOLDEN_PACKET"
          test -d "$TQSDK_DAILY_KLINE_GOLDEN_PACKET"
          test -f "$TQSDK_DAILY_KLINE_GOLDEN_PACKET/manifest.json"
          test -f "$TQSDK_DAILY_KLINE_GOLDEN_PACKET/manifest.sha256"
          cd "$TQSDK_DAILY_KLINE_GOLDEN_PACKET"
          actual_paths="$(sed -E 's/^[[:xdigit:]]{64} [ *](.*)$/\1/' manifest.sha256 | LC_ALL=C sort)"
          expected_paths="$(find . -type f ! -name manifest.sha256 -printf '%P\n' | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          sha256sum --strict --check manifest.sha256
      - name: Compare native 1d and local 2d to 28d Klines
        run: cargo test -p tqsdk-data --test daily_kline_golden -- --ignored
  rust:
    name: Rust SDK crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Check SDK examples
        run: cargo check --examples

      - name: Test SDK crates
        run: cargo test

      - name: Test SDK crates all features
        run: cargo test --all-features

      - name: Clippy SDK examples and all targets
        run: cargo clippy --examples --all-targets -- -D warnings

      - name: Check SDK no default features
        run: cargo check --no-default-features

      - name: Check SDK no default features examples
        run: cargo check --no-default-features --examples

      - name: Test session no default features
        run: cargo test -p tqsdk-session --no-default-features

      - name: Check SDK all features examples
        run: cargo check --all-features --examples

      - name: Strict SDK docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: SDK package metadata
        run: cargo package --no-verify

  relay-rust:
    name: Relay Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check relay no default features
        run: cargo check -p tqsdk-relay --no-default-features

      - name: Test relay
        run: cargo test -p tqsdk-relay --tests

      - name: Clippy relay
        run: cargo clippy -p tqsdk-relay --all-targets -- -D warnings

      - name: Strict relay docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p tqsdk-relay --no-deps --all-features

  relay-dashboard:
    name: Relay dashboard UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crates/tqsdk-relay/dashboard-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte
        run: pnpm run check

      - name: Test dashboard
        run: pnpm run test

      - name: Build embedded dashboard
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test dashboard e2e
        run: pnpm run test:e2e

  fuzz-build:
    name: Fuzz targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

  ctpse-helper-platforms:
    name: CTPSE helper (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build embedded helper
        run: cargo build -p tqsdk-ctpse-helper --bin tqsdk-ctpse-helper --target ${{ matrix.target }}

      - name: Run embedded helper (Unix)
        if: runner.os != 'Windows'
        run: |
          payload="$(target/${{ matrix.target }}/debug/tqsdk-ctpse-helper)"
          printf '%s' "$payload" | grep -Eq '^\{"client_system_info":"[^"[:space:]]+"\}$'

      - name: Run embedded helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $payload = & "target/${{ matrix.target }}/debug/tqsdk-ctpse-helper.exe"
          if ($LASTEXITCODE -ne 0) { throw "helper failed with exit code $LASTEXITCODE" }
          $result = $payload | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($result.client_system_info)) {
            throw "helper returned no client_system_info"
          }
