name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Check examples
        run: cargo check --workspace --examples

      - name: Test workspace
        run: cargo test --workspace

      - name: Test workspace all features
        run: cargo test --workspace --all-features

      - name: Clippy examples and all targets
        run: cargo clippy --workspace --examples --all-targets -- -D warnings

      - name: Check no default features
        run: cargo check --workspace --no-default-features

      - name: Check no default features examples
        run: cargo check --workspace --no-default-features --examples

      - name: Test session no default features
        run: cargo test -p tqsdk-session --no-default-features

      - name: Check all features examples
        run: cargo check --workspace --all-features --examples

      - name: Strict docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Package metadata
        run: cargo package --workspace --no-verify

  fuzz-build:
    name: Fuzz targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build
