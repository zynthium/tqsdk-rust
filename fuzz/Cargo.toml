[package]
name = "tqsdk-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"
tqsdk-core = { path = "../crates/tqsdk-core" }
tqsdk-data = { path = "../crates/tqsdk-data" }

[[bin]]
name = "core_frame_payload"
path = "fuzz_targets/core_frame_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_adapter_decode"
path = "fuzz_targets/core_adapter_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_market_cache_event"
path = "fuzz_targets/data_market_cache_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_history_cache_scan"
path = "fuzz_targets/data_history_cache_scan.rs"
test = false
doc = false
bench = false
