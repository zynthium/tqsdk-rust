[package]
name = "tqsdk-runtime-contract"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
url = "2"
yawc = "0.3.3"

[dev-dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "http", "rustls-tls-webpki-roots"] }
