[workspace]
members = [
    "crates/tqsdk",
    "crates/tqsdk-core",
    "crates/tqsdk-data",
    "crates/tqsdk-relay",
    "crates/tqsdk-session",
    "crates/tqsdk-wait",
    "crates/tqsdk-stream",
    "crates/tqsdk-task",
]
exclude = ["fuzz"]
default-members = [
    "crates/tqsdk",
    "crates/tqsdk-core",
    "crates/tqsdk-data",
    "crates/tqsdk-relay",
    "crates/tqsdk-session",
    "crates/tqsdk-wait",
    "crates/tqsdk-stream",
    "crates/tqsdk-task",
]
resolver = "3"

[workspace.package]
license = "MIT"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3"
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
url = "2"
yawc = { version = "0.3.3", features = ["zlib"] }
flate2 = "1"
