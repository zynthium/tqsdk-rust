[workspace]
members = [
    "crates/tqsdk-core",
    "crates/tqsdk-data",
    "crates/tqsdk-session",
    "crates/tqsdk-wait",
    "crates/tqsdk-stream",
    "crates/tqsdk-task",
]
default-members = [
    "crates/tqsdk-core",
    "crates/tqsdk-data",
    "crates/tqsdk-session",
    "crates/tqsdk-wait",
    "crates/tqsdk-stream",
    "crates/tqsdk-task",
]
resolver = "3"

[workspace.package]
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
url = "2"
yawc = "0.3.3"
