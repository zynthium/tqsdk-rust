[package]
name = "tqsdk-stream"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust async stream facade built on tqsdk-core and tqsdk-session"
documentation = "https://docs.rs/tqsdk-stream"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zynthium/tqsdk-rust"

[features]
default = ["live", "services"]
live = ["tqsdk-session/live"]
services = ["tqsdk-session/services"]

[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tqsdk-core = { path = "../tqsdk-core", version = "0.1.0" }
tqsdk-session = { path = "../tqsdk-session", version = "0.1.0", default-features = false }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "kline_stream"
required-features = ["live"]

[[example]]
name = "quote_stream"
required-features = ["live"]

[[example]]
name = "quote_stream_with_session_query"
required-features = ["live"]

[[example]]
name = "trade_session_events"
required-features = ["live"]
