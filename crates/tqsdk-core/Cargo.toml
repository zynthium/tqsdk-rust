[package]
name = "tqsdk-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Low-level async protocol substrate for Tianqin/TQSDK services"
documentation = "https://docs.rs/tqsdk-core"
readme = "README.md"
license.workspace = true
repository = "https://github.com/zynthium/tqsdk-rust"

[features]
default = ["websocket-transport"]
websocket-transport = ["dep:base64", "dep:percent-encoding", "dep:rustls", "dep:rustls-native-certs", "dep:tokio-rustls", "dep:webpki-roots", "dep:yawc"]

[dependencies]
chrono.workspace = true
base64 = { workspace = true, optional = true }
futures.workspace = true
percent-encoding = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
url.workspace = true
webpki-roots = { workspace = true, optional = true }
yawc = { workspace = true, optional = true }

[dev-dependencies]
sha1.workspace = true

[lints]
workspace = true
