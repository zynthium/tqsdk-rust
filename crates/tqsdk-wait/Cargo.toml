[package]
name = "tqsdk-wait"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Python-style wait_update facade built on tqsdk-core and tqsdk-session"
documentation = "https://docs.rs/tqsdk-wait"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zynthium/tqsdk-rust"

[features]
default = ["live", "services"]
live = ["tqsdk-session/live"]
services = ["tqsdk-session/services"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core", version = "0.1.0" }
tqsdk-session = { path = "../tqsdk-session", version = "0.1.0", default-features = false }

[[example]]
name = "quote_wait"
required-features = ["live"]

[[example]]
name = "quote_wait_with_session_query"
required-features = ["live"]
