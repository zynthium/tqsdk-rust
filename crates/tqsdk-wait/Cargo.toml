[package]
name = "tqsdk-wait"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Python-style wait_update facade built on tqsdk-core and tqsdk-session"
documentation = "https://docs.rs/tqsdk-wait"
readme = "README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core" }
tqsdk-session = { path = "../tqsdk-session" }
