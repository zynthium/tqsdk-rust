[package]
name = "tqsdk-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Research and offline data tooling for tqsdk-rust"
documentation = "https://docs.rs/tqsdk-data"
readme = "README.md"
license.workspace = true
repository = "https://github.com/zynthium/tqsdk-rust"

[features]
default = ["live", "services", "tqbn-zstd"]
live = ["tqsdk-session/live"]
services = ["dep:reqwest", "tqsdk-session/services"]
tqbn-zstd = ["dep:zstd"]

[dependencies]
chrono.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
serde_json.workspace = true
fs2 = "0.4"
tqsdk-core = { path = "../tqsdk-core", version = "0.1.0", default-features = false }
tqsdk-session = { path = "../tqsdk-session", version = "0.1.0", default-features = false }
tokio.workspace = true
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core", version = "0.1.0", default-features = false }

[lints]
workspace = true

[[example]]
name = "kline_data_download"
required-features = ["live"]

[[example]]
name = "kline_data_page"
required-features = ["live"]

[[example]]
name = "kline_data_series"
required-features = ["live"]

[[example]]
name = "kline_export_csv"
required-features = ["live"]

[[example]]
name = "option_greeks"
required-features = ["live"]

[[example]]
name = "tick_data_download"
required-features = ["live"]

[[example]]
name = "tick_export_csv"
required-features = ["live"]
