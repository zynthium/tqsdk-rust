[package]
name = "tqsdk-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Research and offline data tooling for tqsdk-rust"
documentation = "https://docs.rs/tqsdk-data"
readme = "README.md"

[features]
default = ["live", "services"]
live = ["tqsdk-session/live"]
services = ["dep:reqwest", "tqsdk-session/services"]
stream = ["dep:futures", "dep:tqsdk-stream"]

[dependencies]
chrono.workspace = true
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
fs2 = "0.4"
memmap2 = "0.9"
tqsdk-core = { path = "../tqsdk-core" }
tqsdk-session = { path = "../tqsdk-session", default-features = false }
tqsdk-stream = { path = "../tqsdk-stream", default-features = false, optional = true }
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core" }

[[example]]
name = "kline_data_download"
required-features = ["live"]

[[example]]
name = "kline_data_page"
required-features = ["live"]

[[example]]
name = "kline_data_series"
required-features = ["live"]

[[example]]
name = "kline_export_csv"
required-features = ["live"]

[[example]]
name = "option_greeks"
required-features = ["live"]

[[example]]
name = "tick_data_download"
required-features = ["live"]

[[example]]
name = "tick_export_csv"
required-features = ["live"]

[[example]]
name = "api_contract_s18_live_market_cache_pipe"
required-features = ["live", "stream"]
