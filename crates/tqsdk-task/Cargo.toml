[package]
name = "tqsdk-task"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Task and execution tooling built on tqsdk-wait"
documentation = "https://docs.rs/tqsdk-task"
readme = "README.md"

[dependencies]
tqsdk-wait = { path = "../tqsdk-wait" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
tqsdk-core = { path = "../tqsdk-core" }
tqsdk-session = { path = "../tqsdk-session" }
