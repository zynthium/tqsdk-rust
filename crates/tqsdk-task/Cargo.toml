[package]
name = "tqsdk-task"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Task and execution tooling built on tqsdk-wait"
documentation = "https://docs.rs/tqsdk-task"
readme = "README.md"

[features]
default = ["live", "services"]
live = ["tqsdk-session/live", "tqsdk-wait/live"]
services = ["tqsdk-session/services", "tqsdk-wait/services"]

[dependencies]
chrono.workspace = true
serde_json.workspace = true
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core" }
tqsdk-data = { path = "../tqsdk-data", default-features = false }
tqsdk-session = { path = "../tqsdk-session", default-features = false }
tqsdk-wait = { path = "../tqsdk-wait", default-features = false }

[[example]]
name = "target_pos"
required-features = ["live"]

[[example]]
name = "target_pos_scheduler"
required-features = ["live"]
