[package]
name = "tqsdk-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Optional market relay and cache service for tqsdk-rust"
documentation = "https://docs.rs/tqsdk-relay"
readme = "README.md"
license.workspace = true
repository = "https://github.com/zynthium/tqsdk-rust"
build = "build.rs"

[features]
default = ["server", "metadata", "history"]
history = ["tqsdk-data/tqbn-zstd", "tokio/rt-multi-thread"]
metadata = ["dep:tqsdk-session"]
server = ["dep:yawc", "tqsdk-core/websocket-transport"]

[dependencies]
chrono.workspace = true
core_affinity.workspace = true
futures.workspace = true
include_dir.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core", version = "0.1.0", default-features = false }
tqsdk-data = { path = "../tqsdk-data", version = "0.1.0", default-features = false }
tqsdk-session = { path = "../tqsdk-session", version = "0.1.0", optional = true }
yawc = { workspace = true, optional = true }
flate2.workspace = true

[dev-dependencies]
serde_json.workspace = true
