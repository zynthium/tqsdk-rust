[package]
name = "tqsdk-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared async session and direct-query layer for tqsdk-core"
documentation = "https://docs.rs/tqsdk-session"
readme = "README.md"
license.workspace = true
repository = "https://github.com/zynthium/tqsdk-rust"

[features]
default = ["live", "services"]
http-client = ["dep:reqwest"]
live = ["http-client", "tq-auth"]
services = ["http-client"]
tq-auth = ["dep:base64", "http-client"]

[dependencies]
base64 = { workspace = true, optional = true }
chrono.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core", version = "0.1.0" }
url.workspace = true

[[example]]
name = "trade_login_tqkq"
required-features = ["live"]

[[example]]
name = "api_contract_s27_metadata_service_queries"
required-features = ["services"]
