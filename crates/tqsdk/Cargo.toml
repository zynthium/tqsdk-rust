[package]
name = "tqsdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "User-facing facade crate for tqsdk-rust"
documentation = "https://docs.rs/tqsdk"
readme = "README.md"
license.workspace = true
repository = "https://github.com/zynthium/tqsdk-rust"

[features]
default = ["live", "services"]
live = [
    "tqsdk-data/live",
    "tqsdk-session/live",
    "tqsdk-task/live",
    "tqsdk-wait/live",
]
services = [
    "tqsdk-data/services",
    "tqsdk-session/services",
    "tqsdk-task/services",
    "tqsdk-wait/services",
]
monitoring = ["dep:tqsdk-monitor"]
tqbn-zstd = ["tqsdk-data/tqbn-zstd", "tqsdk-task/tqbn-zstd"]

[dependencies]
chrono.workspace = true
tokio.workspace = true
tqsdk-core = { path = "../tqsdk-core", version = "0.1.0", default-features = false }
tqsdk-data = { path = "../tqsdk-data", version = "0.1.0", default-features = false }
tqsdk-monitor = { path = "../tqsdk-monitor", version = "0.1.0", optional = true }
tqsdk-session = { path = "../tqsdk-session", version = "0.1.0", default-features = false }
tqsdk-task = { path = "../tqsdk-task", version = "0.1.0", default-features = false }
tqsdk-wait = { path = "../tqsdk-wait", version = "0.1.0", default-features = false }

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "api_contract_s33_default_facade"
required-features = ["live"]

[[example]]
name = "api_contract_s37_facade_server_backtest"
required-features = ["live"]

[[example]]
name = "api_contract_s38_facade_local_backtest"

[[example]]
name = "api_contract_s39_facade_same_body"

[[example]]
name = "api_contract_s40_facade_local_backtest_target_pos"

[[example]]
name = "api_contract_s41_facade_server_replay"
required-features = ["live", "services"]

[[example]]
name = "api_contract_s43_facade_backtest_history_cache"

[[example]]
name = "api_contract_s44_facade_backtest_remote_on_miss"
required-features = ["live"]

[[example]]
name = "api_contract_s45_facade_backtest_cache_warmup"
required-features = ["live"]

[lints]
workspace = true

[[example]]
name = "trade_with_relay"
required-features = ["live"]
